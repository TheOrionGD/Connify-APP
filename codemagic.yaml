workflows:
  react-native-ios:
    name: React Native iOS Build
    working_directory: Connify
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: ad_hoc # Changed from app_store for GitHub release distribution
        bundle_identifier: com.connify
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "ios/Connify.xcworkspace" \
            --scheme "Connify"
      - name: Publish to GitHub Releases
        script: |
          # Make sure to add GITHUB_TOKEN to your environment variables in Codemagic UI
          # This creates a release on GitHub and uploads the generated .ipa
          gh release create "v1.0.${BUILD_NUMBER}" \
            --title "iOS Build v1.0.${BUILD_NUMBER}" \
            --notes "Automated Codemagic build." \
            build/ios/ipa/*.ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log