<style>
      body {
        background-color: #f9f9f9; /* Soft Beige from surface-bright/background */
        overflow: hidden;
      }

      .material-symbols-outlined {
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;

        0% { width: 0%; }
        20% { width: 15%; }
        45% { width: 45%; }

      @keyframes pulse-ring {
        0% { transform: scale(0.95); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(0.95); opacity: 0.8; }
      }

      .fade-in-up {
        animation: fadeInUp 1s ease-out forwards;
      }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const loadingText = document.getElementById('loading-text');
            const messages = [
                "Initializing Safety Network...",
                "Syncing Real-time Protocols...",
                "Establishing Secure Channel...",
                "Activating Response Layer...",
                "Ready for Coordination."
            ];
            
            let currentMessage = 0;
            const interval = setInterval(() => {
                if (currentMessage < messages.length - 1) {
                    currentMessage++;
                    loadingText.style.opacity = 0;
                    setTimeout(() => {
                        loadingText.textContent = messages[currentMessage];
                        loadingText.style.opacity = 1;
                    }, 300);
                } else {
                    clearInterval(interval);
                }
            }, 800);

            // Optional: Transition to dashboard simulation
            setTimeout(() => {
                document.body.classList.add('transition-opacity', 'duration-1000', 'opacity-0');
                console.log('Transition to main dashboard...');
            }, 4500);
        });
    </script>
