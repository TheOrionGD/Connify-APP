<script>
        // Micro-interaction for Countdown
        let seconds = 14 * 60 + 59;
        const countdownEl = document.getElementById('countdown');
        
        setInterval(() => {
            if (seconds > 0) {
                seconds--;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                countdownEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
                
                // Critical state at 2 minutes
                if (seconds < 120) {
                    countdownEl.classList.add('animate-pulse');
                    countdownEl.classList.remove('text-primary');
                    countdownEl.classList.add('text-error');
                }
            }
        }, 1000);

        // Simulated haptic feedback on buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            });
        });
    </script>
