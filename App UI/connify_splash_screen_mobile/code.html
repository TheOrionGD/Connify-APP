<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        @keyframes scan-line {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .animate-pulse-ring {
            animation: pulse-ring 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .scanner-effect {
            background: linear-gradient(to bottom, transparent 0%, rgba(182, 1, 0, 0.1) 50%, transparent 100%);
            animation: scan-line 2.5s linear infinite;
        }

        /* Urgent Serenity aesthetic: Stable, high-contrast, minimalist */
        .connify-container {
            max-width: 480px;
            margin: 0 auto;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased overflow-hidden">
<!-- Splash Content Wrapper -->
<main class="relative h-screen flex flex-col items-center justify-between py-16 px-container-padding connify-container overflow-hidden">
<!-- Subtle Atmospheric Background -->
<div class="absolute inset-0 z-0 opacity-10 pointer-events-none">
<div class="scanner-effect absolute inset-0 w-full h-1/2"></div>
</div>
<!-- Spacer for centering -->
<div></div>
<!-- Center Branding Cluster -->
<div class="relative z-10 flex flex-col items-center gap-8 text-center">
<!-- Shield Icon Container -->
<div class="relative group">
<!-- Outer Pulse Rings -->
<div class="absolute inset-0 -m-4 rounded-full border-2 border-primary/20 animate-pulse-ring"></div>
<div class="absolute inset-0 -m-8 rounded-full border border-primary/10 animate-pulse-ring" style="animation-delay: 1s;"></div>
<!-- Main Icon Body -->
<div class="relative w-32 h-32 md:w-40 md:h-40 bg-primary-container rounded-full flex items-center justify-center border-width-heavy border-on-primary shadow-lg transform transition-transform duration-500 group-hover:scale-105">
<span class="material-symbols-outlined text-on-primary-container !text-[64px] md:!text-[80px]" data-icon="shield_with_heart" style="font-variation-settings: 'FILL' 1;">shield_with_heart</span>
</div>
</div>
<!-- Wordmark -->
<div class="space-y-2">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg tracking-tight text-on-surface">
                    Connify
                </h1>
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest opacity-80">
                    Safe &amp; Coordinate
                </p>
</div>
</div>
<!-- Footer / Status Indicator -->
<div class="relative z-10 flex flex-col items-center gap-4">
<!-- Loading Dots Animation -->
<div class="flex gap-2 mb-2">
<div class="w-1.5 h-1.5 bg-primary rounded-full animate-bounce" style="animation-delay: 0s"></div>
<div class="w-1.5 h-1.5 bg-primary rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
<div class="w-1.5 h-1.5 bg-primary rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
</div>
<!-- Subtle Label -->
<p class="font-label-md text-label-md text-on-surface-variant opacity-70 transition-opacity duration-1000" id="status-label">
                Establishing Secure Protocol...
            </p>
</div>
<!-- Background Decorative Element (Level 0 Base Tone) -->
<div class="fixed bottom-0 left-0 right-0 h-1/3 bg-gradient-to-t from-surface-dim/30 to-transparent pointer-events-none"></div>
</main>
<!-- Micro-interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusLabel = document.getElementById('status-label');
            const messages = [
                "Establishing Secure Protocol...",
                "Syncing Trust Circles...",
                "Activating Alert Matrix...",
                "Ready for Coordination"
            ];
            let index = 0;

            const updateStatus = () => {
                statusLabel.style.opacity = '0';
                setTimeout(() => {
                    index = (index + 1) % messages.length;
                    statusLabel.textContent = messages[index];
                    statusLabel.style.opacity = '0.7';
                }, 1000);
            };

            // Rotate messages every 2.5 seconds
            setInterval(updateStatus, 3500);

            // Simple Haptic-like interaction on the icon
            const icon = document.querySelector('.group');
            icon.addEventListener('click', () => {
                icon.style.transform = 'scale(0.9)';
                setTimeout(() => {
                    icon.style.transform = 'scale(1)';
                }, 150);
            });
        });
    </script>
</body></html>
