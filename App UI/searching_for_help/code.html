<script>
        // Micro-interaction for status updates and progress bar
        const statusText = document.getElementById('status-text');
        const progressFill = document.getElementById('progress-fill');
        const progressPercent = document.getElementById('progress-percent');

        const statuses = [
            "Searching for nearby responders...",
            "Validating secure perimeter...",
            "Authenticating trust nodes...",
            "Encrypting location data...",
            "Verifying responder credentials...",
            "Signal strength optimized..."
        ];

        let currentStatusIndex = 0;
        let progressValue = 42;

        setInterval(() => {
            // Update Status Text
            currentStatusIndex = (currentStatusIndex + 1) % statuses.length;
            statusText.textContent = statuses[currentStatusIndex];

            // Update Progress Bar
            if(progressValue < 98) {
                progressValue += Math.floor(Math.random() * 3) + 1;
                progressFill.style.width = `${progressValue}%`;
                progressPercent.textContent = `${progressValue}%`;
            }
        }, 3000);

        // Simple button active state visual feedback extension
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => btn.classList.add('opacity-80'));
            btn.addEventListener('touchend', () => btn.classList.remove('opacity-80'));
        });
    </script>
