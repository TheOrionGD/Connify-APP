      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .scanner-bracket {
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: #b60100;
        }
        .scanner-bracket-tl { top: 0; left: 0; border-top-width: 4px; border-left-width: 4px; }
        .scanner-bracket-tr { top: 0; right: 0; border-top-width: 4px; border-right-width: 4px; }
        .scanner-bracket-bl { bottom: 0; left: 0; border-bottom-width: 4px; border-left-width: 4px; }
        .scanner-bracket-br { bottom: 0; right: 0; border-bottom-width: 4px; border-right-width: 4px; }
        
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
        .scan-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #b60100, transparent);
            position: absolute;
            width: 100%;
            animation: scan 2s linear infinite;
        }
        
        /* Hide scrollbar */
        body::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- Top AppBar (from JSON guidance) -->
<header class="w-full top-0 left-0 bg-background border-b border-outline-variant flex justify-between items-center px-container-padding py-base w-full max-w-[480px] mx-auto z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="shield">shield</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Identity Verification</h1>
</div>
<button class="active:scale-95 transition-transform p-2 rounded-full hover:bg-surface-container-high">
<span class="material-symbols-outlined text-primary" data-icon="emergency">emergency</span>
</button>
</header>
<main class="flex-1 w-full max-w-[480px] mx-auto px-container-padding pt-6 pb-32 flex flex-col gap-stack-gap">
<!-- Camera Viewfinder Section -->
<div class="relative w-full aspect-square rounded-xl overflow-hidden border-border-width-heavy border-on-background bg-surface-container-highest">
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover grayscale-[0.2]" data-alt="A POV shot from a smartphone camera perspective looking at a blurred urban street at dusk. The focus is soft, prioritizing the digital UI overlays. The lighting is warm and cinematic, reflecting the Connify brand aesthetic of urgent serenity and high-contrast bold safety elements." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAUbscmeBSyWs1jXnAheqyOxybA2h7F0qS-hj43Uh0Og4sJn5To4Uta_Fb9OHIFn3WrkJAhCjOad8WyMcRwuEamy4pyVJh0a2nYsV8_LFR7s2jAHlrP35Nqcbsk_JPibv-p3gd9mmh5-T88dJ6OpDxr6BDYu0enlohcO1NMhUdBjSr_HGi92v7bnkjeMet4OB8l9bIE9sOTweC0Gc50IIavqsHJzWgcxo5yf-OcC31skIunOSLtJ4JM">
</div>
<!-- Red Corner Brackets -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="relative w-3/4 h-3/4">
<div class="scanner-bracket scanner-bracket-tl"></div>
<div class="scanner-bracket scanner-bracket-tr"></div>
<div class="scanner-bracket scanner-bracket-bl"></div>
<div class="scanner-bracket scanner-bracket-br"></div>
<div class="scan-line"></div>
</div>
</div>
<!-- Overlay Label -->
<div class="absolute top-4 left-1/2 -translate-x-1/2 bg-on-background px-4 py-1 rounded-full">
<span class="text-surface font-label-md text-label-md tracking-widest uppercase">Align QR Code</span>
</div>
</div>
<!-- Proximity & Handshake Status Card -->
<div class="bg-surface-container-lowest border-border-width-light border-on-background p-4 rounded-xl flex flex-col gap-3">
<div class="flex justify-between items-center">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface-variant uppercase opacity-70">Proximity</span>
<span class="font-headline-sm text-headline-sm text-on-background">2m (Excellent)</span>
</div>
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="distance">distance</span>
</div>
</div>
<div class="h-[1px] bg-outline-variant"></div>
<div class="flex justify-between items-center">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface-variant uppercase opacity-70">Handshake</span>
<span class="font-headline-sm text-headline-sm text-on-background" id="handshake-status">Pending</span>
</div>
<div class="animate-spin w-6 h-6 border-2 border-primary border-t-transparent rounded-full" id="handshake-loader"></div>
</div>
</div>
<!-- States Toggle / Debug Section (As requested) -->
<div class="flex flex-col gap-base">
<p class="font-label-md text-label-md text-on-surface-variant text-center">SIMULATION CONTROLS</p>
<div class="grid grid-cols-2 gap-inline-gap">
<button class="bg-surface-container border border-on-background py-2 font-label-md text-label-md rounded-lg active:bg-surface-container-high transition-colors" onclick="toggleState('success')">Success</button>
<button class="bg-surface-container border border-on-background py-2 font-label-md text-label-md rounded-lg active:bg-surface-container-high transition-colors" onclick="toggleState('error')">Error</button>
</div>
</div>
<!-- Dynamic State Cards -->
<div class="hidden" id="state-container">
<!-- Success State -->
<div class="hidden bg-surface-container-lowest border-border-width-heavy border-primary p-4 rounded-xl flex items-center gap-4" id="state-success">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-primary">Handshake Success</h3>
<p class="font-body-md text-body-md text-on-surface">Identity confirmed via secure protocol.</p>
</div>
</div>
<!-- Error State -->
<div class="hidden bg-error-container border-border-width-heavy border-error p-4 rounded-xl flex items-center gap-4" id="state-error">
<div class="w-10 h-10 rounded-full bg-error flex items-center justify-center">
<span class="material-symbols-outlined text-on-error" data-icon="warning" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-error">Verification Error</h3>
<p class="font-body-md text-body-md text-on-error-container font-bold uppercase tracking-tight">ID Mismatch - Secure perimeter breached</p>
</div>
</div>
</div>
</main>
<!-- Bottom Actions Container -->
<div class="fixed bottom-0 w-full max-w-[480px] left-1/2 -translate-x-1/2 p-container-padding bg-background/80 backdrop-blur-md z-40">
<button class="w-full bg-primary py-5 rounded-xl text-on-primary font-headline-sm text-headline-sm uppercase tracking-widest active:scale-95 transition-all shadow-lg" id="issue-button">
            ISSUE TRUST CAPSULE
        </button>
</div>
<!-- Hidden Nav Shell (Mandatory Structure but suppressed contextually for task focus) -->
<nav aria-hidden="true" class="hidden"></nav>
<script>
        function toggleState(type) {
            const container = document.getElementById('state-container');
            const success = document.getElementById('state-success');
            const error = document.getElementById('state-error');
            const handshakeLabel = document.getElementById('handshake-status');
            const handshakeLoader = document.getElementById('handshake-loader');
            const issueBtn = document.getElementById('issue-button');

            container.classList.remove('hidden');
            
            if (type === 'success') {
                success.classList.remove('hidden');
                error.classList.add('hidden');
                handshakeLabel.innerText = 'Authenticated';
                handshakeLabel.classList.add('text-primary');
                handshakeLoader.classList.add('hidden');
                issueBtn.innerText = 'DEPLOY TRUST';
                issueBtn.classList.replace('bg-primary', 'bg-on-background');
            } else {
                error.classList.remove('hidden');
                success.classList.add('hidden');
                handshakeLabel.innerText = 'Failed';
                handshakeLabel.classList.add('text-error');
                handshakeLoader.classList.add('hidden');
                issueBtn.innerText = 'ABORT SESSION';
                issueBtn.classList.replace('bg-primary', 'bg-error');
            }
        }

        // Micro-interaction: button pulse
        document.getElementById('issue-button').addEventListener('click', function() {
            this.classList.add('scale-95');
            setTimeout(() => this.classList.remove('scale-95'), 100);
        });
    </script>
</body></html>
