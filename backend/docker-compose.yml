version: '3.9'

# Local development services for Connify backend
# Run: docker compose up -d

services:
  redis:
    image: redis:7-alpine
    container_name: connify_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
    driver: local
